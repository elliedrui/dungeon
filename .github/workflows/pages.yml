# Publishes the game to GitHub Pages on every push to main.
# Only the dungeon/ folder goes on the site, and only if the tests pass.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits for the one already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test tests/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dungeon
      - id: deployment
        uses: actions/deploy-pages@v5
